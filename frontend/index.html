<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Assistant documentaire</title>
  <!-- Résolution de l'apparence avant le premier rendu : la préférence système
       (prefers-color-scheme) est la valeur par défaut, un choix explicite la
       surcharge. Aucun flash clair/sombre, aucun réglage obligatoire. -->
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('theme'); } catch (error) { /* stockage indisponible */ }
      var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var dark = mode === 'dark' || (mode === 'system' && prefersDark);
      var root = document.documentElement;
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      root.setAttribute('data-theme-mode', mode);
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip-link" href="#question">Aller à la zone de question</a>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="sidebar-head">
        <span class="brand"><span class="brand-mark" aria-hidden="true">◈</span><span>Assistant documentaire</span></span>
        <button id="sidebar-close" class="icon-button" type="button" aria-label="Fermer le panneau">✕</button>
      </div>
      <button id="new-chat" class="new-chat" type="button">
        <span aria-hidden="true">＋</span><span>Nouvelle conversation</span>
      </button>
      <p class="history-label" id="history-label">Historique</p>
      <nav id="history" class="history" aria-labelledby="history-label"></nav>
      <div class="sidebar-bottom">
        <button id="theme-toggle" class="quiet-button" type="button">
          <span class="theme-icon" aria-hidden="true">◐</span><span class="theme-label">Thème : système</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="mobile-header" role="banner">
        <button id="mobile-history" class="icon-button" type="button" aria-label="Ouvrir l'historique" aria-expanded="false" aria-controls="sidebar">
          <span aria-hidden="true">☰</span>
        </button>
        <span class="mobile-header-title">Assistant documentaire</span>
        <button id="mobile-new-chat" class="icon-button" type="button" aria-label="Nouvelle conversation">
          <span aria-hidden="true">＋</span>
        </button>
        <button id="mobile-theme" class="icon-button" type="button" aria-label="Changer le thème">
          <span aria-hidden="true">◐</span>
        </button>
      </header>

      <section id="chat" class="chat" aria-label="Conversation">
        <div id="welcome" class="welcome">
          <div class="welcome-icon" aria-hidden="true">◈</div>
          <h1>Comment puis-je vous aider&nbsp;?</h1>
          <p>Je réponds uniquement à partir des documents internes indexés, et chaque réponse cite ses sources.</p>
          <div class="examples" aria-label="Exemples de questions">
            <button type="button" data-question="Quelles sont les règles d'utilisation d'internet au travail ?">Règles d’utilisation d’internet</button>
            <button type="button" data-question="Comment demander un congé ?">Demander un congé</button>
            <button type="button" data-question="Quelle est la procédure de télétravail ?">Procédure de télétravail</button>
            <button type="button" data-question="Comment valider une dépense ?">Valider une dépense</button>
          </div>
        </div>
      </section>

      <div class="composer-wrap">
        <div class="composer-inner">
          <label class="composer-label" for="question">Votre question</label>
          <form id="composer" class="composer">
            <textarea id="question" rows="1" maxlength="4000"
              aria-describedby="composer-hint"
              placeholder="Posez votre question sur les documents internes…"
              autofocus></textarea>
            <div class="composer-actions">
              <button id="stop" class="stop-button" type="button" hidden aria-label="Arrêter la génération de la réponse">Arrêter</button>
              <button id="send" class="send-button" type="submit" aria-label="Envoyer la question">
                <span aria-hidden="true">↑</span>
              </button>
            </div>
          </form>
          <div class="composer-footer">
            <p class="hint" id="composer-hint">Entrée pour envoyer · Maj + Entrée pour un retour à la ligne</p>
            <p class="char-count" id="char-count" aria-hidden="true" hidden></p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <button id="sidebar-scrim" class="sidebar-scrim" type="button" tabindex="-1" aria-hidden="true" hidden></button>
  <p id="live-status" class="sr-only" role="status" aria-live="polite"></p>

  <template id="message-template">
    <article class="message">
      <div class="avatar" aria-hidden="true"></div>
      <div class="message-content">
        <div class="message-toolbar">
          <span class="sender"></span>
          <button class="copy quiet-button" type="button" aria-label="Copier la réponse">Copier</button>
        </div>
        <div class="markdown"></div>
        <div class="sources"></div>
      </div>
    </article>
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
